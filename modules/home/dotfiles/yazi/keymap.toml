# "$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = ["<Enter>"]
run = "plugin smart-enter"
desc = "Enter the child directory, or open the selected file"

[[mgr.prepend_keymap]]
on = ["<Backspace>"]
run = "leave"
desc = "Go back to the parent directory"

prepend_keymap = [
    # glow.yazi  ctrl+e , ctrl+y
    { on = ["<C-e>"], run = "seek 5" },
    { on = ["<C-y>"], run = "seek -5" },
]

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore preview"

[[mgr.prepend_keymap]]
on   = "P"
run  = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"

# ---- Bookmarks ----
[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd ~/Downloads"
desc = "Go to Downloads"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd /mnt/data"
desc = "Go to NTFS drive"

[[mgr.prepend_keymap]]
on = ["g", "c"]
run = "cd ~/nixos-config"
desc = "Go to NixOS config"

# ---- Shell / clipboard ----
[[mgr.prepend_keymap]]
on = ["!"]
run = "shell --interactive"
desc = "Open a shell here"

[[mgr.prepend_keymap]]
on = ["Y"]
run = 'shell "echo -n $1 | wl-copy" --confirm'
desc = "Copy path to system clipboard"
