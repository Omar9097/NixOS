# ── Monitor ─────────────────────────────────────────────
monitor=,1920x1080,auto,1.0
# monitor=eDP-1,1920x1080@60,0x0,1.0   # explicit for external displays

###################
### MY PROGRAMS ###
###################
$terminal = foot
$fileManager = pcmanfm           # already in home/packages.nix (change to dolphin if you install it)
$menu = rofi -show drun
$reload_waybar = killall -SIGUSR2 waybar   # cleaner reload without flicker
$snip = grim -g "$(slurp)" - | wl-copy    # select area → clipboard


#################
### AUTOSTART ###
#################
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = hyprpaper
exec-once = mako
exec-once = wl-paste --watch cliphist store
exec-once = systemctl --user start hyprpolkitagent

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
# GTK theme & icons are now set by Home Manager (theme.nix) – no need to duplicate here.


#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 2
    gaps_out = 2
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}


#############
### INPUT ###
#############
input {
    kb_layout = us
    kb_options = caps:swapescape
    follow_mouse = 1
    sensitivity = 0
    repeat_rate = 35
    repeat_delay = 200
    touchpad {
        natural_scroll = false
    }
}

cursor {
    inactive_timeout = 30
    no_hardware_cursors = true   # required for NVIDIA + Wayland
}

# (Removed unused device block – epic-mouse-v1 was a placeholder)


####################
### KEYBINDINGS ###
####################
$mainMod = SUPER

# Launch apps
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, D, exec, $menu
bind = $mainMod, R, exec, $reload_waybar
bind = $mainMod, S, exec, $snip

# Clipboard history
bind = $mainMod, V, exec, clipboard-menu
bind = $mainMod SHIFT, V, exec, clipboard-wipe

# Focus movement (Vim-style: h=left, j=down, k=up, l=right)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
# bind = $mainMod, 0, workspace, 10

# Move windows to workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
# bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse window management
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume
bindel = , XF86AudioRaiseVolume, exec, volume-notify up
bindel = , XF86AudioLowerVolume, exec, volume-notify down
bindel = , XF86AudioMute, exec, volume-notify mute

bindel = $mainMod, equal, exec, volume-notify up
bindel = $mainMod, minus, exec, volume-notify down
bindel = $mainMod, 0, exec, volume-notify mute

# Brightness
bindel = , XF86MonBrightnessUp, exec, brightness-notify up
bindel = , XF86MonBrightnessDown, exec, brightness-notify down

bindel = $mainMod SHIFT, equal, exec, brightness-notify up
bindel = $mainMod SHIFT, minus, exec, brightness-notify down

# Screenshots
bind = , Print, exec, screenshot-menu
bind = $mainMod, Print, exec, grim - | wl-copy && notify-send "Screenshot" "Full screen copied to clipboard"
bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Region copied to clipboard"
bind = $mainMod CTRL, Print, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | wl-copy && notify-send "Screenshot" "Window copied to clipboard"

# Screenshots with editing (swappy)
bind = $mainMod ALT, Print, exec, grim - | swappy -f -
bind = $mainMod SHIFT ALT, Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod CTRL ALT, Print, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | swappy -f -
